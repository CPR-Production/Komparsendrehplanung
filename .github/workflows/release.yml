# Tag → Nutzlast je Plattform → Installer → Release mit Prüfsummen.
#
# Die Matrix ist nicht bequem, sondern nötig: better-sqlite3 ist ein natives
# Addon und entsteht nur auf der Zielplattform. macOS läuft doppelt, weil Intel
# und Apple Silicon getrennte Binaries brauchen.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Ein gescheiterter Runner soll die anderen Installer nicht mitnehmen —
      # dann fehlt eine Plattform statt aller.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos
          - runner: macos-13
            platform: macos
          - runner: ubuntu-22.04
            platform: linux
          - runner: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v4

      # Diese Version landet in der Binary: die SEA entsteht aus dem Node des
      # Runners, und das Addon wird gegen dieselbe ABI installiert.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version aus dem Tag ableiten
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Der Docker-Weg stempelt keine Version ein, er liest sie aus der
      # package.json. Läuft die aus dem Tritt, meldet jede Docker-Installation
      # dauerhaft ein verfügbares Update — auch direkt nach dem Update. Deshalb
      # bricht das Release lieber ab, als eine falsche Version auszuliefern.
      - name: Version gegen die package.json prüfen
        shell: bash
        run: |
          # Verglichen wird nur der Kern der Version: Eine Vorabversion trägt
          # denselben Kern wie das Release, das aus ihr wird — v0.2.0-rc1 gehört
          # zu package.json 0.2.0. Die dort auf "0.2.0-rc1" zu ziehen wäre
          # Ballast, der gleich wieder zurückmüsste.
          core="${VERSION%%-*}"
          for file in package.json apps/server/package.json; do
            declared="$(node -p "require('./$file').version")"
            if [ "$declared" != "$core" ]; then
              echo "::error::$file steht auf $declared, der Tag lautet v$VERSION — erwartet wird $core."
              echo "Vor dem Tag beide Dateien auf $core ziehen (siehe docs/release-pipeline-und-installer.md)."
              exit 1
            fi
          done

      - name: Abhängigkeiten installieren
        shell: bash
        run: npm ci

      - name: Tests
        shell: bash
        run: npm run test --workspace packages/shared

      - name: Nutzlast bauen
        shell: bash
        run: npm run build:release -- --version="$VERSION"

      - name: Installer bauen (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash infra/installer/macos/package.sh "$VERSION"

      - name: Installer bauen (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: bash infra/installer/linux/package.sh "$VERSION"

      - name: Installer bauen (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "infra\installer\windows\komparsen.iss"

      - name: Rauchtest der gepackten Binary
        shell: bash
        run: bash scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runner }}
          path: build/release/dist/*
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Für die Herkunftsbescheinigung der Artefakte.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Vor den Prüfsummen, damit die SHA256SUMS.txt nicht selbst mitbescheinigt
      # wird — bescheinigt gehören die Installer.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Prüfsummen bilden
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Ein Tag mit Suffix (v1.2.0-rc1) wird Vorabversion. Der Update-Check
          # in apps/server/src/routes/updates.ts überspringt die, das Banner
          # bleibt bei Testreleases also still.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          # Zwei Wege führen hierher: ein gepushter Tag (dann gibt es noch kein
          # Release) oder ein über die GitHub-Oberfläche angelegtes Release
          # (dann schon). Dasselbe gilt für einen Wiederholungslauf nach einem
          # gescheiterten Runner. Deshalb anlegen nur, wenn es noch nichts gibt,
          # sonst die Dateien anhängen — --clobber, damit ein zweiter Lauf die
          # Datei desselben Namens ersetzt statt zu scheitern.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME existiert bereits — hänge die Dateien an."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease
          fi
